# Builds every extension under extensions/ into one bundle and attaches it to a GitHub Release when a v tag is pushed
# (git tag v2.0.0 && git push origin v2.0.0), or a release made on GitHub's website. Kav reads the latest release's bundle at its next check.
#
# It builds with the same tools as a build by hand: JDK 21, Kotlin 2.2.10, Android platform 36 and build tools 36.0.0,
# and Noam's kit at a fixed commit, so a new kit or a newer Android on GitHub's runner can't change a release by surprise.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  KIT_COMMIT: 09d55cd738fe6f5a65cc6d6a08f0928405b55d52   # Kav extension kit, 2026-11-28. Move it on when you want a newer kit.
  KOTLIN_VERSION: 2.2.10
  BUNDLE: yairs-kav-extensions.kavb

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ImNoammm/kav-extension-kit
          ref: ${{ env.KIT_COMMIT }}
          path: kav-extension-kit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Java, Kotlin and the Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "KOTLINC=$RUNNER_TEMP/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

          # The runner has several Android platforms and the kit takes the newest, so give it only these two.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          mkdir -p "$RUNNER_TEMP/sdk/platforms" "$RUNNER_TEMP/sdk/build-tools"
          ln -s "$ANDROID_HOME/platforms/android-36" "$RUNNER_TEMP/sdk/platforms/android-36"
          ln -s "$ANDROID_HOME/build-tools/36.0.0" "$RUNNER_TEMP/sdk/build-tools/36.0.0"
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build the bundle
        working-directory: source
        run: |
          node ../kav-extension-kit/bin/kavx.js bundle . --name "Yair's extensions" --icon icon.png --out "$RUNNER_TEMP/$BUNDLE"
          node ../kav-extension-kit/bin/kavx.js verify "$RUNNER_TEMP/$BUNDLE"

      - name: Release it
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release made on GitHub's website (which also makes the tag): keep its text, and put the bundle on it,
            # in place of one already there. Kav takes a release with exactly one .kavb.
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$BUNDLE" --clobber
          else
            # A tag pushed on its own: make the release. Its text comes from RELEASE_NOTES.md when the repository has
            # one, else GitHub lists the commits.
            if [ -f RELEASE_NOTES.md ]; then notes=(--notes-file RELEASE_NOTES.md); else notes=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$BUNDLE" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"
          fi
